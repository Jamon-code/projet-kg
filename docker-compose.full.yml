# Stack COMPLET (fidele au schema du prof) : HDFS + Neo4j + service IA (LLM + Spark + GraphRAG + app).
# Lancer :  docker compose -f docker-compose.full.yml up -d --build
services:

  # ---------------- HDFS ----------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: cine-namenode
    hostname: namenode
    environment:
      - CLUSTER_NAME=cinema
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9870:9870"
    volumes:
      - hdfs_name:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: cine-datanode
    hostname: datanode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9000
    depends_on:
      - namenode
    volumes:
      - hdfs_data:/hadoop/dfs/data

  # ---------------- Neo4j (+ GDS) ----------------
  neo4j:
    image: neo4j:5.26-community
    container_name: cine-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - ./neo4j/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------- Service IA (LLM + Spark local + GraphRAG + Streamlit) ----------------
  ai:
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: cine-ai
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "8501:8501"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      HDFS_URI: hdfs://namenode:9000
      HADOOP_USER_NAME: root
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - ./:/home/jovyan/work
    depends_on:
      neo4j:
        condition: service_healthy
      namenode:
        condition: service_started
    command:
      - start-notebook.py
      - --NotebookApp.token=
      - --NotebookApp.password=

  # ---------------- API REST (LLM extraction + GraphRAG + monitoring + controle d'acces) ----------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: cine-api
    restart: unless-stopped
    working_dir: /home/jovyan/work
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      HDFS_URI: hdfs://namenode:9000
      HADOOP_USER_NAME: root
      API_KEY: ${API_KEY:-cine-demo-key}
    volumes:
      - ./:/home/jovyan/work
    depends_on:
      neo4j:
        condition: service_healthy
      namenode:
        condition: service_started
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  hdfs_name:
  hdfs_data:
